[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'xetex-stack-renderer'
version = '0.7'
description = 'External renderer framework for Unicode-driven stacked scripts in XeTeX'
readme = 'README.md'
requires-python = '>=3.11'
license = { text = 'MIT' }
authors = [{ name = 'xetex-stack-renderer contributors' }]
dependencies = ['fonttools>=4.50,<5', 'pillow>=10']

[project.optional-dependencies]
test = ['pytest>=8', 'pymupdf>=1.24']

[project.scripts]
xsr-render = 'xsr.renderer:main'

[tool.pytest.ini_options]
addopts = '-q'
testpaths = ['tests']

[tool.setuptools.packages.find]
where = ['src']

[tool.setuptools.package-data]
'xsr.egyptian' = ['unicode-LICENSE.txt']
